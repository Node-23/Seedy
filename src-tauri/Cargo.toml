[package]
name = "seedy"
version = "0.1.0"
description = "Seedy — IDE Java minimalista, guiada pelo teclado"
authors = ["Matheus Vinicius Linhares"]
license-file = "../LICENSE.md"
repository = "https://github.com/Node-23/seedy"
edition = "2021"
rust-version = "1.80"

[lib]
name = "seedy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "8"
dirs = "6"
ignore = "0.4"
regex = "1"
ureq = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
