  <!-- caule -->
  <path d="M32 40 C32 33 31.2 28.5 32 22" fill="none" stroke="#9CD7BA" stroke-width="3.4" stroke-linecap="round"/>
  <!-- folhas -->
  <path d="M31.4 26.5 C24.5 26.8 19.2 22.6 18.2 15.2 C25.6 14.8 30.4 19 31.4 26.5 Z" fill="#9CD7BA"/>
  <path d="M32.4 23.2 C38.4 23.2 43.4 19.4 45.4 12.6 C38.6 12.4 33.8 16.2 32.4 23.2 Z" fill="#9CD7BA"/>
  <!-- semente, aberta em cima por onde o broto sai -->
  <path d="M17 45.5 C17 39.6 23.6 36.2 29.6 36 L32 39.6 L34.4 36 C40.4 36.2 47 39.6 47 45.5 C47 50.8 40.2 54 32 54 C23.8 54 17 50.8 17 45.5 Z" fill="#E9E2D3"/>
  <path d="M23.5 46.5 C25.5 49 28.5 50.2 32 50.4" fill="none" stroke="#19191B" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
</svg>
